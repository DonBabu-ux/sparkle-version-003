# Continuous integration: every push and PR is checked before it can be merged
# or released. The release workflow publishes an OTA bundle and an APK to real
# users, so a build that has never been linted, type-checked or tested cannot be
# allowed to reach it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and the tests that need no database. These run on every push and are
  # the floor: nothing ships without them.
  backend:
    name: Backend (lint + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint backend
        run: npm run lint:backend

      # BACKEND_TEST_SCOPE=pure runs the suites that need no database. The
      # runner classifies them by scanning for infrastructure imports, so a
      # new suite is placed correctly without this list needing an update.
      - name: Backend unit tests (no database required)
        run: BACKEND_TEST_SCOPE=pure npm test

  # The 15 suites that talk to MySQL/Redis. They need a database and a
  # JWT_SECRET, supplied as repository secrets; without them this job is
  # skipped rather than failing, so the gate is honest about what it covered.
  backend-integration:
    name: Backend (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ secrets.DB_HOST != '' }}
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT || '3306' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure backend environment
        run: |
          cat > backend/.env <<EOF
          DB_HOST=$DB_HOST
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          DB_PORT=$DB_PORT
          JWT_SECRET=$JWT_SECRET
          EOF

      - name: Backend integration tests (all suites)
        run: npm test

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc still reports errors inherited from before this gate existed, so it
      # would fail on a clean checkout. The baseline gate allows any number of
      # fixes and blocks every newly introduced error, which is the part that
      # keeps the type surface from getting worse.
      - name: Type check (no new errors)
        working-directory: frontend
        run: npm run typecheck:gate

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

  # Single blocking result for branch protection: require this check on main.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - run: echo "Backend and frontend gates passed."
