apply plugin: 'com.android.application'

android {
    // `=` assignment syntax: the space-separated form is deprecated on AGP 8
    // and removed in AGP 9, so migrate it while we are here.
    namespace = "com.sparkleapp"
    compileSdk = rootProject.ext.compileSdkVersion

    // ── Versioning ──────────────────────────────────────────────────────────
    // versionName (what users see + the APK file name): sourced from
    // frontend/package.json so a frontend change that bumps the version flows
    // straight into the APK — no manual edit of this file per release.
    // versionCode (monotonic int required by adb/Play): auto-incremented from
    // version.properties on every *packaging* build (assemble/bundle/install),
    // so `adb install -r` over an existing build never hits a downgrade
    // error. Gradle syncs/clean do NOT burn a code (they don't match the task
    // filter below), so the counter only moves when you actually build.
    def frontendPackageJson = new File(rootDir, '../frontend/package.json')
    def frontendVersion = '1.0.0'
    if (frontendPackageJson.exists()) {
        try {
            def pkg = new groovy.json.JsonSlurper().parseText(frontendPackageJson.text)
            if (pkg.version) {
                frontendVersion = pkg.version
            }
        } catch (Exception e) {
            logger.warn("WARNING: could not parse frontend/package.json version (${e.message}); using ${frontendVersion}")
        }
    }
    // NOTE: `file()` here resolves against the :app module dir — use
// rootProject.file() so this reads android/version.properties.
def versionPropsFile = rootProject.file('version.properties')
    def versionProps = new Properties()
    if (versionPropsFile.exists()) {
        versionPropsFile.withInputStream { versionProps.load(it) }
    }
    def lastVersionCode = versionProps.getProperty('VERSION_CODE', '7') as int
    def isPackagingBuild = gradle.startParameter.taskNames.any { name ->
        def n = name.toLowerCase()
        n.contains('assemble') || n.contains('bundle') || n.contains('install') || n.contains('package')
    }
    def nextVersionCode = isPackagingBuild ? lastVersionCode + 1 : lastVersionCode
    if (isPackagingBuild) {
        // VERSION_NAME is intentionally not persisted: versionName is sourced
        // from frontend/package.json at configuration time, so a copy here
        // would only go stale on the next version bump. The file exists purely
        // as the monotonic versionCode counter.
        versionProps.setProperty('VERSION_CODE', nextVersionCode.toString())
        versionPropsFile.withOutputStream { versionProps.store(it, 'Auto-written by app/build.gradle. versionCode auto-increments per packaging build.') }
    }

    defaultConfig {
        applicationId "com.sparkleapp"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode nextVersionCode
        versionName frontendVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // aaptOptions {
        //      // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        //      // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        //     ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        // }
    }
    signingConfigs {
        release {
            if (project.hasProperty("STORE_PASSWORD")) {
                storeFile file("sparkle-release.jks")
                storePassword project.property("STORE_PASSWORD")
                keyAlias project.property("KEY_ALIAS")
                keyPassword project.property("KEY_PASSWORD")
            }
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "sparkle-${variant.versionName}.apk"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            // R8 only strips unused *code*; without this, unused resources
            // (drawables of unshipped plugins, etc.) still ship in the APK.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only wire the signing config when the credentials are actually
            // present. An empty signingConfig used to be referenced here
            // unconditionally, which didn't "produce an unsigned APK" — it
            // crashed packaging with:
            //   SigningConfig "release" is missing required property "storeFile"
            // Release builds are then usable locally (R8/lint/APK inspection)
            // but must never be uploaded.
            if (project.hasProperty("STORE_PASSWORD")) {
                signingConfig signingConfigs.release
            } else {
                // Local release builds: sign with the debug key so the APK is
                // installable via adb. Debug-signed releases must NEVER be
                // uploaded to Play — Play rejects them.
                signingConfig signingConfigs.debug
                logger.warn("WARNING: building a DEBUG-SIGNED release APK — STORE_PASSWORD is not set. " +
                        "Installable locally only. Pass -PSTORE_PASSWORD=... -PKEY_ALIAS=... -PKEY_PASSWORD=... for a distributable build.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Firebase: SparkleFirebaseMessagingService (cold-start calls) compiles
    // against firebase-messaging directly — the Capacitor push plugin only
    // exposes it at runtime, not on this module's compile classpath. Version
    // pinned to the one the plugin resolves, so both see the same classes.
    implementation "com.google.firebase:firebase-messaging:23.3.1"
    // Crashlytics: native crashes (a killed WebView renderer, a rejected FGS
    // start) were previously invisible in a WebView shell. The crashlytics
    // *SDK* auto-initializes from google-services.json — no Gradle plugin
    // needed; the plugin's only role is the mapping-file upload, and release
    // stack readability is handled by the proguard keep below.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-crashlytics"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Robolectric: JSObject is backed by org.json, which is an android.jar
    // stub in plain unit tests; the call-state snapshot tests need a real one.
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
