<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="50%" stop-color="#C71585" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <linearGradient id="sparkleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9370DB" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF1493" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Circle with Glass & Gradient Glow -->
  <circle cx="256" cy="256" r="236" fill="url(#sparkleGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" />

  <!-- Center Main Sparkle Emblem -->
  <g transform="translate(256 256)">
    <!-- Four Pointed Primary Star -->
    <path d="M0 -150 C15 -50 50 -15 150 0 C50 15 15 50 0 150 C-15 50 -50 15 -150 0 C-50 -15 -15 -50 0 -150 Z" fill="#FFFFFF" />
    
    <!-- Four Pointed Diamond Accent Star -->
    <path d="M0 -75 C8 -25 25 -8 75 0 C25 8 8 25 0 75 C-8 25 -25 8 -75 0 C-25 -8 -8 -25 0 -75 Z" fill="#FFE4E1" opacity="0.9" />

    <!-- Top Right Sparkle Burst -->
    <g transform="translate(90 -90) scale(0.4)">
      <path d="M0 -80 C8 -25 25 -8 80 0 C25 8 8 25 0 80 C-8 25 -25 8 -80 0 C-25 -8 -8 -25 0 -80 Z" fill="#FFFFFF" />
    </g>

    <!-- Bottom Left Sparkle Burst -->
    <g transform="translate(-100 80) scale(0.3)">
      <path d="M0 -80 C8 -25 25 -8 80 0 C25 8 8 25 0 80 C-8 25 -25 8 -80 0 C-25 -8 -8 -25 0 -80 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
